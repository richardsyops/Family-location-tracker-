<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Live Location Tracker</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: sans-serif;
  }
  #map {
    height: 100vh;
    width: 100%;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 8px 14px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 14px;
  }
  #sidebar {
    position: absolute;
    top: 0;
    right: 0;
    height: 100%;
    width: 240px;
    background: white;
    z-index: 1000;
    box-shadow: -2px 0 6px rgba(0,0,0,0.3);
    overflow-y: auto;
    transition: transform 0.2s ease;
  }
  #sidebar.hidden {
    transform: translateX(100%);
  }
  #sidebar h3 {
    margin: 0;
    padding: 14px;
    border-bottom: 1px solid #eee;
    font-size: 15px;
  }
  #sidebar-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #sidebar-list li {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
    cursor: pointer;
  }
  #sidebar-list li .person-name {
    font-weight: bold;
    display: block;
  }
  #sidebar-list li .last-seen {
    color: #777;
    font-size: 12px;
  }
  #sidebar-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1001;
    background: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="status">Getting your location...</div>
<button id="sidebar-toggle">☰ Family</button>
<div id="sidebar" class="hidden">
  <h3>Family Members</h3>
  <ul id="sidebar-list"></ul>
</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (compat SDK - works with plain <script> tags, no build tools needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
  // ---- 1. Firebase setup ----
  const firebaseConfig = {
    apiKey: "AIzaSyB_gJ5fqObdoajcnyqjvFlf5TRdl4U2oDQ",
    authDomain: "family-safety-tracking.firebaseapp.com",
    databaseURL: "https://family-safety-tracking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "family-safety-tracking",
    storageBucket: "family-safety-tracking.firebasestorage.app",
    messagingSenderId: "778400009939",
    appId: "1:778400009939:web:29ed4eb571e3860c8d0e26"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  // Ask for a display name once, and remember it
  let userName = localStorage.getItem('trackerUserName');
  if (!userName) {
    userName = prompt("What's your name? (shown on the map to others)") || "Unknown";
    localStorage.setItem('trackerUserName', userName);
  }

  // ---- 2. Map setup ----
  const map = L.map('map').setView([9.0820, 8.6753], 6); // default: center of Nigeria

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    maxZoom: 19
  }).addTo(map);

  let marker = null;
  let accuracyCircle = null;
  const statusEl = document.getElementById('status');
  const otherMarkers = {}; // keeps track of every other person's marker, keyed by their userId
  const sidebarList = document.getElementById('sidebar-list');

  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('hidden');
  });

  function timeAgo(timestamp) {
    if (!timestamp) return 'never';
    const seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + 'm ago';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  // ---- 3. Sign in anonymously first. Everything else only starts once we're authenticated. ----
  statusEl.textContent = "Signing in...";

  auth.signInAnonymously().catch((error) => {
    statusEl.textContent = "Sign-in error: " + error.message;
    console.error(error);
  });

  auth.onAuthStateChanged((user) => {
    if (!user) return; // not signed in yet, wait

    const userId = user.uid; // this now matches auth.uid, which our database rules check against
    statusEl.textContent = "Getting your location...";

    // ---- 4. Get and watch the browser's GPS location ----
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy; // in meters

          statusEl.textContent = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)} (±${Math.round(accuracy)}m)`;

          // Move the map + marker
          if (!marker) {
            marker = L.marker([lat, lng]).addTo(map);
            accuracyCircle = L.circle([lat, lng], { radius: accuracy, color: '#3388ff', fillOpacity: 0.1 }).addTo(map);
            map.setView([lat, lng], 16);
          } else {
            marker.setLatLng([lat, lng]);
            accuracyCircle.setLatLng([lat, lng]);
            accuracyCircle.setRadius(accuracy);
          }

          // ---- 5. Push location to Firebase ----
          db.ref('locations/' + userId).set({
            name: userName,
            lat: lat,
            lng: lng,
            timestamp: Date.now()
          });
        },
        (error) => {
          statusEl.textContent = "Location error: " + error.message;
          console.error(error);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }
      );
    } else {
      statusEl.textContent = "Geolocation not supported by this browser.";
    }

    // ---- 6. Listen for EVERYONE's location (including our own) and draw markers + sidebar list ----
    db.ref('locations').on('value', (snapshot) => {
      const allLocations = snapshot.val() || {};

      Object.keys(allLocations).forEach((id) => {
        if (id === userId) return; // skip ourselves, we already draw our own marker above

        const person = allLocations[id];
        if (!person || typeof person.lat !== 'number' || typeof person.lng !== 'number') return;

        if (otherMarkers[id]) {
          otherMarkers[id].setLatLng([person.lat, person.lng]);
        } else {
          otherMarkers[id] = L.marker([person.lat, person.lng], {
            icon: L.divIcon({
              className: 'other-user-icon',
              html: `<div style="background:#e74c3c;color:white;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap;">${person.name || 'Unknown'}</div>`,
              iconSize: null
            })
          }).addTo(map);
        }
      });

      // Remove markers for anyone no longer in the database
      Object.keys(otherMarkers).forEach((id) => {
        if (!allLocations[id]) {
          map.removeLayer(otherMarkers[id]);
          delete otherMarkers[id];
        }
      });

      // ---- Rebuild the sidebar list ----
      sidebarList.innerHTML = '';
      Object.keys(allLocations).forEach((id) => {
        const person = allLocations[id];
        if (!person) return;

        const li = document.createElement('li');
        const isMe = id === userId;
        li.innerHTML = `<span class="person-name">${person.name || 'Unknown'}${isMe ? ' (you)' : ''}</span><span class="last-seen">${timeAgo(person.timestamp)}</span>`;

        li.addEventListener('click', () => {
          if (typeof person.lat === 'number' && typeof person.lng === 'number') {
            map.setView([person.lat, person.lng], 16);
            document.getElementById('sidebar').classList.add('hidden');
          }
        });

        sidebarList.appendChild(li);
      });
    });
  });
</script>

</body>
</html>
